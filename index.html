<style>
  :root{
    --navy:#1F4E79; --navy-dark:#153854; --bg:#F4F7FA; --card:#FFFFFF;
    --line:#E3E9EF; --text:#1C2733; --muted:#6B7887; --green:#2E8B57;
    --gold:#D8A73D; --weekA:#F6A24A; --weekB:#4A90D9; --red:#D9534F;
    --radius:14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;
    overscroll-behavior-y:none;}
  #app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
  header.topbar{
    padding:calc(14px + var(--safe-top)) 18px 14px;
    background:linear-gradient(135deg,var(--navy),var(--navy-dark));
    color:#fff; position:sticky; top:0; z-index:20;
  }
  header.topbar h1{margin:0;font-size:19px;font-weight:700;}
  header.topbar .sub{font-size:13px;opacity:.85;margin-top:2px;}
  .weekpill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;
    background:rgba(255,255,255,.18); margin-top:8px;}
  main{flex:1;padding:14px 14px calc(90px + var(--safe-bottom));}
  .card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(20,30,50,.06);border:1px solid var(--line);}
  .progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .progress-bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden;}
  .progress-bar > div{height:100%;background:linear-gradient(90deg,var(--green),#3fb372);
    width:0%;transition:width .35s ease;}
  .progress-label{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;}
  .exercise{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);}
  .exercise:last-child{border-bottom:none;}
  .checkbox{width:26px;height:26px;border-radius:50%;border:2px solid #C9D3DC;flex:0 0 26px;
    display:flex;align-items:center;justify-content:center;margin-top:1px;transition:.15s;background:#fff;}
  .checkbox.checked{background:var(--green);border-color:var(--green);}
  .checkbox.checked:after{content:"✓";color:#fff;font-size:15px;font-weight:800;}
  .ex-body{flex:1;min-width:0;}
  .ex-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ex-name{font-size:15px;font-weight:600;}
  .ex-name.done{color:var(--muted);text-decoration:line-through;}
  .badge-week{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;color:#fff;}
  .badge-week.A{background:var(--weekA);}
  .badge-week.B{background:var(--weekB);}
  .ex-sr{font-size:13px;color:var(--navy);font-weight:600;margin-top:2px;}
  .ex-notes{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .ex-link{font-size:12.5px;color:var(--navy);font-weight:600;margin-top:5px;display:inline-block;
    text-decoration:none;border-bottom:1px solid var(--navy);}
  .cardio-card{border:2px dashed #C9D3DC;border-radius:12px;padding:12px;margin-top:8px;}
  .cardio-card.logged{border-style:solid;border-color:var(--green);background:#F1FAF4;}
  .seg{display:flex;gap:8px;margin:8px 0;}
  .seg button{flex:1;padding:9px 4px;border-radius:9px;border:1.5px solid var(--line);
    background:#fff;font-size:13px;font-weight:600;color:var(--text);}
  .seg button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .row2{display:flex;gap:8px;}
  .field{flex:1;}
  .field label{font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:3px;}
  .field input, .field select{width:100%;padding:9px 8px;border-radius:9px;border:1.5px solid var(--line);
    font-size:15px;background:#fff;color:var(--text);}
  .btn{display:inline-block;padding:11px 18px;border-radius:11px;border:none;font-size:14.5px;
    font-weight:700;background:var(--navy);color:#fff;text-align:center;cursor:pointer;}
  .btn.small{padding:8px 14px;font-size:13px;}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
  .btn.block{width:100%;margin-top:10px;}
  .btn.danger{background:var(--red);}
  .btn:disabled{opacity:.4;}
  .cardio-summary{font-size:13.5px;color:var(--text);margin-top:6px;}
  .cardio-summary b{color:var(--green);}
  .finish-btn{position:sticky;bottom:calc(14px + var(--safe-bottom));width:100%;padding:15px;
    border-radius:14px;border:none;font-size:16px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--green),#3fb372); box-shadow:0 6px 16px rgba(46,139,87,.35);}
  .finish-btn:disabled{background:#B9C3CC;box-shadow:none;}
  .rest-card{text-align:center;padding:40px 20px;}
  .rest-emoji{font-size:52px;}
  .rest-card h2{margin:10px 0 4px;}
  .rest-card p{color:var(--muted);font-size:14px;line-height:1.5;}
  nav.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);
    backdrop-filter:blur(10px); border-top:1px solid var(--line); display:flex;
    padding-bottom:var(--safe-bottom); z-index:30; max-width:560px; margin:0 auto;}
  nav.tabbar button{flex:1;background:none;border:none;padding:9px 2px 8px;display:flex;
    flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10.5px;font-weight:600;}
  nav.tabbar button .ic{font-size:20px;line-height:1;}
  nav.tabbar button.active{color:var(--navy);}
  .section-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;margin:18px 4px 8px;}
  .stat-row{display:flex;gap:10px;}
  .stat-card{flex:1;background:var(--card);border-radius:var(--radius);padding:14px;text-align:center;
    border:1px solid var(--line);}
  .stat-card .num{font-size:24px;font-weight:800;color:var(--navy);}
  .stat-card .lbl{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 10px;}
  .cal-head button{background:none;border:none;font-size:20px;color:var(--navy);padding:4px 10px;}
  .cal-head .mon{font-weight:800;font-size:15px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-dow{font-size:10px;text-align:center;color:var(--muted);font-weight:700;}
  .cal-cell{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:700;background:#EEF2F6;color:var(--muted);position:relative;}
  .cal-cell.empty{background:transparent;}
  .cal-cell.rest{background:#E7EAED;color:#9AA5AF;}
  .cal-cell.done{background:var(--green);color:#fff;}
  .cal-cell.missed{background:#FBE7E6;color:var(--red);}
  .cal-cell.today{box-shadow:0 0 0 2px var(--navy) inset;}
  .cal-cell.future{background:#F4F7FA;color:#C3CBD3;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px;}
  .legend span{display:inline-flex;align-items:center;gap:4px;}
  .dot{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .badge-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .badge-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 10px;text-align:center;}
  .badge-card.locked{opacity:.42;}
  .badge-card .ic{font-size:30px;}
  .badge-card .nm{font-size:12.5px;font-weight:800;margin-top:6px;}
  .badge-card .ds{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.3;}
  .badge-card .pg{font-size:10px;color:var(--navy);font-weight:700;margin-top:5px;}
  .toast-overlay{position:fixed;inset:0;background:rgba(20,30,50,.55);display:flex;
    align-items:center;justify-content:center;z-index:100;padding:30px;}
  .toast-card{background:#fff;border-radius:20px;padding:28px 22px;text-align:center;max-width:340px;
    box-shadow:0 20px 50px rgba(0,0,0,.3);}
  .toast-card .ic{font-size:54px;}
  .toast-card h3{margin:10px 0 4px;color:var(--navy);}
  .toast-card p{color:var(--muted);font-size:13.5px;margin:0 0 16px;}
  .settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;
    border-bottom:1px solid var(--line);}
  .settings-row:last-child{border-bottom:none;}
  .settings-row .lbl{font-size:14.5px;font-weight:600;}
  .settings-row .desc{font-size:12px;color:var(--muted);margin-top:2px;}
  .hidden{display:none !important;}
  a{color:inherit;}
  .modal-day{background:#fff;border-radius:16px;padding:18px;max-width:340px;width:100%;}
  .modal-day h3{margin:0 0 10px;}
  .modal-day .item{font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;
    justify-content:space-between;gap:8px;}
  .close-x{position:absolute;top:14px;right:16px;font-size:22px;color:var(--muted);background:none;border:none;}
</style>
</head>

/* ============================= STORAGE ============================= */
const STORE_KEY = "calisthenicsPlanData_v1";
function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {logs:{}, settings:{weekOverride:"auto"}, earnedBadges:{}};
}
function saveData(){ localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); }
let DATA = loadData();

/* ============================= HELPERS ============================= */
function pad(n){ return n<10 ? "0"+n : ""+n; }
function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayDate(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function getWeekNumber(d){
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = dt.getUTCDay() || 7;
  dt.setUTCDate(dt.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(dt.getUTCFullYear(),0,1));
  return Math.ceil((((dt-yearStart)/86400000)+1)/7);
}
function weekLetterFor(d){
  if(DATA.settings.weekOverride && DATA.settings.weekOverride!=="auto") return DATA.settings.weekOverride;
  return (getWeekNumber(d) % 2 === 0) ? "A" : "B";
}
const DOW_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function planFor(d){ return PLAN[d.getDay()]; }
function itemsFor(plan, weekLetter){
  return plan.items.filter(it => it.week==="both" || it.week===weekLetter);
}
function logFor(dateStr){
  if(!DATA.logs[dateStr]) DATA.logs[dateStr] = {done:{}, cardio:null, fullyCompleted:false, week:null, dow:null};
  return DATA.logs[dateStr];
}
function milesFromEntry(c){
  if(!c) return 0;
  let d = parseFloat(c.distance)||0;
  if(c.unit==="km") d = d*0.621371;
  return d;
}

/* ============================= STATS COMPUTATION ============================= */
function computeStats(){
  const logs = DATA.logs;
  let totalWorkouts=0, totalMiles=0;
  const cardioTypes = new Set();
  const completedDates = [];
  for(const k in logs){
    const l = logs[k];
    if(l.fullyCompleted){ totalWorkouts++; completedDates.push(k); }
    if(l.cardio){ totalMiles += milesFromEntry(l.cardio); if(l.cardio.type) cardioTypes.add(l.cardio.type); }
  }
  completedDates.sort();

  // streaks over scheduled days (Mon-Sat), Sunday never breaks streak
  function isCompleted(dateStr){ return logs[dateStr] && logs[dateStr].fullyCompleted; }
  function scheduledDow(dow){ return dow !== 0; }

  // current streak: walk backward from today
  let cur = 0;
  let cursor = todayDate();
  // if today isn't completed yet, start from yesterday
  if(!isCompleted(dateKey(cursor))) cursor = addDays(cursor,-1);
  while(true){
    const dow = cursor.getDay();
    if(!scheduledDow(dow)){ cursor = addDays(cursor,-1); continue; }
    const key = dateKey(cursor);
    if(isCompleted(key)){ cur++; cursor = addDays(cursor,-1); }
    else break;
    if(cur>3650) break;
  }

  // longest streak: scan all time between first and last relevant date
  let longest = cur;
  if(completedDates.length){
    const first = new Date(completedDates[0]);
    const last = todayDate();
    let run = 0;
    let d = new Date(first);
    while(d<=last){
      const dow = d.getDay();
      if(scheduledDow(dow)){
        if(isCompleted(dateKey(d))) { run++; longest=Math.max(longest,run); }
        else run = 0;
      }
      d = addDays(d,1);
    }
  }

  // perfect weeks: ISO-week groups where all Mon-Sat scheduled days are completed (only count fully elapsed weeks)
  const byWeek = {};
  for(const k in logs){
    const d = new Date(k+"T00:00:00");
    if(d.getDay()===0) continue;
    const wkKey = d.getFullYear()+"-"+getWeekNumber(d);
    if(!byWeek[wkKey]) byWeek[wkKey] = new Set();
    if(logs[k].fullyCompleted) byWeek[wkKey].add(d.getDay());
  }
  let perfectWeeks = 0;
  for(const wk in byWeek){
    if(byWeek[wk].size>=6) perfectWeeks++;
  }

  return {totalWorkouts, totalMiles, cardioTypes, longestStreak:longest, currentStreak:cur, perfectWeeks};
}

function checkNewBadges(){
  const stats = computeStats();
  const newly = [];
  BADGES.forEach(b=>{
    const earned = b.check(stats);
    if(earned && !DATA.earnedBadges[b.id]){
      DATA.earnedBadges[b.id] = dateKey(todayDate());
      newly.push(b);
    }
  });
  if(newly.length) saveData();
  return newly;
}

/* ============================= RENDER: TODAY ============================= */
function renderToday(){
  const d = todayDate();
  const key = dateKey(d);
  const dow = d.getDay();
  const plan = PLAN[dow];
  const weekLetter = weekLetterFor(d);
  const log = logFor(key);
  log.dow = dow; log.week = plan && plan.hasAlt ? weekLetter : null;

  document.getElementById("hdrTitle").innerHTML = `<h1>${DOW_NAMES[dow]}</h1>`;
  const dstr = `${MONTH_NAMES[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  document.getElementById("hdrSub").textContent = plan ? (plan.title + (plan.subtitle? " · "+plan.subtitle : "")) + " · " + dstr : "Rest Day · " + dstr;
  document.getElementById("hdrWeekPill").innerHTML = (plan && plan.hasAlt) ? `<span class="weekpill">WEEK ${weekLetter}</span>` : "";

  const view = document.getElementById("view");

  if(!plan){
    view.innerHTML = `
      <div class="card rest-card">
        <div class="rest-emoji">😌</div>
        <h2>Rest Day</h2>
        <p>No structured training today - recovery is what lets the rest of the week's work actually build muscle. Light walking or stretching is totally fine.</p>
        <button class="btn ghost" id="restLogBtn" style="margin-top:14px;">${log.fullyCompleted? "✓ Logged as rested" : "Mark today as rested"}</button>
      </div>`;
    document.getElementById("restLogBtn").onclick = ()=>{
      log.fullyCompleted = true;
      saveData();
      renderToday();
    };
    showInstallTipIfNeeded();
    return;
  }

  const items = itemsFor(plan, weekLetter);
  const doneCount = items.filter(it => log.done[it.id]).length;
  const cardioItems = items.filter(it=>it.type==="cardio");
  const allCardioLogged = cardioItems.every(it => log.cardio && log.cardio[it.id]);
  const pct = Math.round((doneCount/items.length)*100);
  const canFinish = doneCount===items.length;

  let html = `
    <div class="card">
      <div class="progress-wrap">
        <div class="progress-bar"><div style="width:${pct}%"></div></div>
        <div class="progress-label">${doneCount}/${items.length}</div>
      </div>`;

  items.forEach(it=>{
    const isDone = !!log.done[it.id];
    if(it.type==="cardio"){
      const c = (log.cardio && log.cardio[it.id]) ? log.cardio[it.id] : null;
      html += `
        <div class="exercise">
          <div class="checkbox ${isDone?'checked':''}"></div>
          <div class="ex-body">
            <div class="ex-title-row"><span class="ex-name ${isDone?'done':''}">${it.name}</span></div>
            <div class="ex-sr">${it.sr}</div>
            <div class="ex-notes">${it.notes}</div>
            <div class="cardio-card ${c?'logged':''}" data-cardio="${it.id}">
              ${c ? `
                <div class="cardio-summary">✅ <b>${c.type}</b> · ${c.distance} ${c.unit} · ${c.duration} min</div>
                <button class="btn small ghost" data-editcardio="${it.id}" style="margin-top:8px;">Edit</button>
              ` : `
                <div class="seg" data-cardiotype="${it.id}">
                  <button data-val="Run">🏃 Run</button>
                  <button data-val="Bike">🚴 Bike</button>
                  <button data-val="Swim">🏊 Swim</button>
                </div>
                <div class="row2">
                  <div class="field"><label>Distance</label><input type="number" inputmode="decimal" step="0.1" min="0" id="dist_${it.id}" placeholder="e.g. 2.5"></div>
                  <div class="field"><label>Unit</label>
                    <select id="unit_${it.id}"><option value="mi">mi</option><option value="km">km</option></select>
                  </div>
                </div>
                <div class="field" style="margin-top:8px;"><label>Time (minutes)</label><input type="number" inputmode="numeric" min="0" id="dur_${it.id}" placeholder="e.g. 25"></div>
                <button class="btn block" data-savecardio="${it.id}">Save cardio</button>
              `}
            </div>
          </div>
        </div>`;
    } else {
      html += `
        <div class="exercise" data-ex="${it.id}">
          <div class="checkbox ${isDone?'checked':''}"></div>
          <div class="ex-body">
            <div class="ex-title-row">
              <span class="ex-name ${isDone?'done':''}">${it.name}</span>
              ${it.week!=="both" ? `<span class="badge-week ${it.week}">${it.week}</span>` : ""}
            </div>
            <div class="ex-sr">${it.sr}</div>
            ${it.notes ? `<div class="ex-notes">${it.notes}</div>` : ""}
            ${it.url ? `<a class="ex-link" href="${it.url}" target="_blank" rel="noopener">How-to guide →</a>` : ""}
          </div>
        </div>`;
    }
  });

  html += `</div>
    <button class="btn finish-btn" id="finishBtn" ${canFinish?'':'disabled'}>${log.fullyCompleted ? "✓ Workout Complete" : "Complete Workout"}</button>
  `;
  view.innerHTML = html;

  // wire checkboxes (non-cardio)
  view.querySelectorAll(".exercise[data-ex]").forEach(row=>{
    row.querySelector(".checkbox").onclick = ()=>{
      const id = row.getAttribute("data-ex");
      log.done[id] = !log.done[id];
      saveData();
      renderToday();
    };
  });
  // cardio seg buttons
  view.querySelectorAll("[data-cardiotype]").forEach(seg=>{
    const id = seg.getAttribute("data-cardiotype");
    seg.querySelectorAll("button").forEach(b=>{
      b.onclick = ()=>{
        seg.querySelectorAll("button").forEach(x=>x.classList.remove("active"));
        b.classList.add("active");
        seg.dataset.selected = b.dataset.val;
      };
    });
  });
  view.querySelectorAll("[data-savecardio]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute("data-savecardio");
      const seg = view.querySelector(`[data-cardiotype="${id}"]`);
      const type = seg ? seg.dataset.selected : null;
      const dist = document.getElementById("dist_"+id).value;
      const unit = document.getElementById("unit_"+id).value;
      const dur = document.getElementById("dur_"+id).value;
      if(!type){ alert("Pick run, bike, or swim first."); return; }
      if(!dist || !dur){ alert("Add distance and time."); return; }
      if(!log.cardio) log.cardio = {};
      log.cardio[id] = {type, distance:dist, unit, duration:dur};
      log.done[id] = true;
      saveData();
      renderToday();
    };
  });
  view.querySelectorAll("[data-editcardio]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute("data-editcardio");
      delete log.cardio[id];
      log.done[id] = false;
      saveData();
      renderToday();
    };
  });

  const finishBtn = document.getElementById("finishBtn");
  if(finishBtn){
    finishBtn.onclick = ()=>{
      if(!canFinish) return;
      log.fullyCompleted = true;
      log.completedAt = Date.now();
      saveData();
      const newBadges = checkNewBadges();
      renderToday();
      if(newBadges.length){ showBadgeToast(newBadges); }
      else { showSimpleToast("Nice work! 🎉", "Workout logged for "+DOW_NAMES[dow]+"."); }
    };
  }
  showInstallTipIfNeeded();
}

function showInstallTipIfNeeded(){
  const isStandalone = window.navigator.standalone === true ||
    (typeof window.matchMedia === "function" && window.matchMedia("(display-mode: standalone)").matches);
  if(isStandalone) return;
  if(localStorage.getItem("installTipDismissed")) return;
  const view = document.getElementById("view");
  const tip = document.createElement("div");
  tip.className = "card";
  tip.style.background = "#FFF8E8";
  tip.style.borderColor = "#F0DFA8";
  tip.innerHTML = `
    <div style="font-size:13.5px;line-height:1.5;">
      📲 <b>Tip:</b> tap the Share icon in Safari, then <b>Add to Home Screen</b> -
      it'll open full-screen like a real app, right to today's workout.
    </div>
    <button class="btn small ghost" id="dismissTip" style="margin-top:10px;">Got it</button>
  `;
  view.insertBefore(tip, view.firstChild);
  document.getElementById("dismissTip").onclick = ()=>{
    localStorage.setItem("installTipDismissed","1");
    tip.remove();
  };
}

function showSimpleToast(title, msg){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="toast-overlay" id="toastOverlay">
      <div class="toast-card">
        <div class="ic">✅</div>
        <h3>${title}</h3>
        <p>${msg}</p>
        <button class="btn block" id="toastClose">Nice!</button>
      </div>
    </div>`;
  document.getElementById("toastClose").onclick = ()=>{ root.innerHTML=""; };
  document.getElementById("toastOverlay").onclick = (e)=>{ if(e.target.id==="toastOverlay") root.innerHTML=""; };
}
function showBadgeToast(badges, i){
  i = i||0;
  const root = document.getElementById("modalRoot");
  const b = badges[i];
  root.innerHTML = `
    <div class="toast-overlay" id="toastOverlay">
      <div class="toast-card">
        <div class="ic">${b.ic}</div>
        <h3>Badge unlocked!</h3>
        <p><b>${b.name}</b><br>${b.desc}</p>
        <button class="btn block" id="toastClose">${i<badges.length-1 ? "Next →" : "Awesome!"}</button>
      </div>
    </div>`;
  document.getElementById("toastClose").onclick = ()=>{
    if(i<badges.length-1) showBadgeToast(badges, i+1);
    else root.innerHTML="";
  };
}

/* ============================= RENDER: HISTORY ============================= */
function renderHistory(){
  document.getElementById("hdrTitle").innerHTML = `<h1>History</h1>`;
  document.getElementById("hdrSub").textContent = "Your training calendar";
  document.getElementById("hdrWeekPill").innerHTML = "";

  const stats = computeStats();
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth()+historyMonthOffset, 1);
  const year = base.getFullYear(), month = base.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = todayDate();

  let cells = "";
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(year, month, day);
    const key = dateKey(d);
    const dow = d.getDay();
    const log = DATA.logs[key];
    let cls = "";
    if(d > today) cls = "future";
    else if(dow===0) cls = "rest";
    else if(log && log.fullyCompleted) cls = "done";
    else if(d < today) cls = "missed";
    if(dateKey(d)===dateKey(today)) cls += " today";
    cells += `<div class="cal-cell ${cls}" data-date="${key}">${day}</div>`;
  }

  const view = document.getElementById("view");
  view.innerHTML = `
    <div class="stat-row">
      <div class="stat-card"><div class="num">${stats.currentStreak}</div><div class="lbl">Current Streak</div></div>
      <div class="stat-card"><div class="num">${stats.longestStreak}</div><div class="lbl">Longest Streak</div></div>
      <div class="stat-card"><div class="num">${stats.totalWorkouts}</div><div class="lbl">Total Workouts</div></div>
    </div>
    <div class="stat-row" style="margin-top:10px;">
      <div class="stat-card"><div class="num">${stats.totalMiles.toFixed(1)}</div><div class="lbl">Cardio Miles</div></div>
      <div class="stat-card"><div class="num">${stats.perfectWeeks}</div><div class="lbl">Perfect Weeks</div></div>
      <div class="stat-card"><div class="num">${Object.values(DATA.earnedBadges).length}</div><div class="lbl">Badges</div></div>
    </div>
    <div class="section-title">Calendar</div>
    <div class="card">
      <div class="cal-head">
        <button id="calPrev">‹</button>
        <div class="mon">${MONTH_NAMES[month]} ${year}</div>
        <button id="calNext">›</button>
      </div>
      <div class="cal-grid">
        <div class="cal-dow">S</div><div class="cal-dow">M</div><div class="cal-dow">T</div>
        <div class="cal-dow">W</div><div class="cal-dow">T</div><div class="cal-dow">F</div><div class="cal-dow">S</div>
        ${cells}
      </div>
      <div class="legend">
        <span><i class="dot" style="background:var(--green)"></i>Completed</span>
        <span><i class="dot" style="background:#FBE7E6"></i>Missed</span>
        <span><i class="dot" style="background:#E7EAED"></i>Rest day</span>
        <span><i class="dot" style="background:var(--navy)"></i>Today</span>
      </div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:8px;">Tap any day - including upcoming ones - to preview that workout.</div>
    </div>
  `;
  document.getElementById("calPrev").onclick = ()=>{ historyMonthOffset--; renderHistory(); };
  document.getElementById("calNext").onclick = ()=>{ if(historyMonthOffset<3){historyMonthOffset++; renderHistory();} };
  view.querySelectorAll(".cal-cell[data-date]").forEach(c=>{
    c.onclick = ()=> showDayModal(c.getAttribute("data-date"));
  });
}

function showDayModal(key){
  const log = DATA.logs[key];
  const d = new Date(key+"T00:00:00");
  const dow = d.getDay();
  const plan = PLAN[dow];
  const isFuture = d > todayDate();
  const root = document.getElementById("modalRoot");
  let body = "";
  let weekBadge = "";

  if(dow===0){
    // Sunday / rest day
    if(log){
      body = `<p style="color:var(--muted);font-size:13.5px;">${log.fullyCompleted? "Marked as rested ✅" : "Not logged"}</p>`;
    } else {
      body = `<p style="color:var(--muted);font-size:13.5px;">${isFuture ? "Rest day - nothing scheduled." : "Nothing logged for this day."}</p>`;
    }
  } else if(plan){
    const weekLetter = (log && log.week) || weekLetterFor(d);
    const items = itemsFor(plan, weekLetter);
    if(plan.hasAlt) weekBadge = `<span class="badge-week ${weekLetter}" style="margin-left:8px;">WEEK ${weekLetter}</span>`;

    if(log){
      // already logged / in progress - show real status
      body = items.map(it=>{
        const done = !!log.done[it.id];
        let extra = "";
        if(it.type==="cardio" && log.cardio && log.cardio[it.id]){
          const c = log.cardio[it.id];
          extra = ` — ${c.type}, ${c.distance}${c.unit}, ${c.duration}min`;
        }
        return `<div class="item"><span>${it.name}${extra}</span><span>${done?'✅':'—'}</span></div>`;
      }).join("");
      body += `<div class="item"><b>Status</b><b>${log.fullyCompleted?'Completed ✅':'Incomplete'}</b></div>`;
    } else if(isFuture){
      // upcoming day - read-only preview of what's planned
      body = `<div style="font-size:12px;color:var(--muted);margin-bottom:6px;">Preview - nothing to check off yet</div>` +
        items.map(it=>{
          const srText = it.sr ? ` — ${it.sr}` : "";
          return `<div class="item"><span>${it.name}${srText}</span><span style="color:var(--muted);">○</span></div>`;
        }).join("");
    } else {
      body = `<p style="color:var(--muted);font-size:13.5px;">Nothing logged for this day.</p>`;
    }
  }

  root.innerHTML = `
    <div class="toast-overlay" id="dayOverlay">
      <div class="modal-day" style="position:relative;max-height:78vh;overflow-y:auto;">
        <button class="close-x" id="dayClose">×</button>
        <h3>${DOW_NAMES[dow]} · ${MONTH_NAMES[d.getMonth()]} ${d.getDate()}${weekBadge}</h3>
        ${body}
      </div>
    </div>`;
  document.getElementById("dayClose").onclick = ()=>{ root.innerHTML=""; };
  document.getElementById("dayOverlay").onclick = (e)=>{ if(e.target.id==="dayOverlay") root.innerHTML=""; };
}

/* ============================= RENDER: AWARDS ============================= */
function renderAwards(){
  document.getElementById("hdrTitle").innerHTML = `<h1>Awards</h1>`;
  document.getElementById("hdrSub").textContent = "Badges earned along the way";
  document.getElementById("hdrWeekPill").innerHTML = "";

  const stats = computeStats();
  const view = document.getElementById("view");
  let html = `<div class="badge-grid">`;
  BADGES.forEach(b=>{
    const earned = !!DATA.earnedBadges[b.id];
    let prog = "";
    if(!earned && b.prog){
      const [cur, target] = b.prog(stats);
      prog = `<div class="pg">${cur} / ${target}</div>`;
    } else if(earned){
      prog = `<div class="pg">Earned ${DATA.earnedBadges[b.id]}</div>`;
    }
    html += `
      <div class="badge-card ${earned?'':'locked'}">
        <div class="ic">${b.ic}</div>
        <div class="nm">${b.name}</div>
        <div class="ds">${b.desc}</div>
        ${prog}
      </div>`;
  });
  html += `</div>`;
  view.innerHTML = html;
}

/* ============================= RENDER: SETTINGS ============================= */
function renderSettings(){
  document.getElementById("hdrTitle").innerHTML = `<h1>Settings</h1>`;
  document.getElementById("hdrSub").textContent = "";
  document.getElementById("hdrWeekPill").innerHTML = "";

  const view = document.getElementById("view");
  const wo = DATA.settings.weekOverride || "auto";
  const stats = computeStats();
  const lastBackupAt = DATA.settings.lastBackupAt || null;
  const daysSinceBackup = lastBackupAt ? Math.floor((Date.now()-lastBackupAt)/86400000) : null;
  const lastBackupStr = lastBackupAt ? new Date(lastBackupAt).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) : "Never";
  const needsNudge = stats.totalWorkouts>=5 && (lastBackupAt===null || daysSinceBackup>=14);

  view.innerHTML = `
    ${needsNudge ? `
    <div class="card" style="background:#FFF8E8;border-color:#F0DFA8;">
      <div style="font-size:13.5px;line-height:1.5;">
        ☁️ <b>${lastBackupAt ? "It's been "+daysSinceBackup+" days since your last Drive backup." : "You haven't backed up to Drive yet."}</b>
        Tap Backup below and choose Google Drive so his streaks are safe if anything happens to the phone.
      </div>
    </div>` : ""}

    <div class="card">
      <div class="settings-row">
        <div>
          <div class="lbl">Week A / B rotation</div>
          <div class="desc">Auto switches every calendar week. Force a week if it ever gets out of sync.</div>
        </div>
      </div>
      <div class="seg" id="weekSeg" style="margin-top:4px;">
        <button data-val="auto" class="${wo==='auto'?'active':''}">Auto</button>
        <button data-val="A" class="${wo==='A'?'active':''}">Force A</button>
        <button data-val="B" class="${wo==='B'?'active':''}">Force B</button>
      </div>
    </div>

    <div class="card">
      <div class="settings-row">
        <div>
          <div class="lbl">Backup to Google Drive</div>
          <div class="desc">Saves history, streaks &amp; badges as a file. When the share sheet opens, pick <b>Google Drive</b> (or Files → Drive) to save it there.</div>
        </div>
      </div>
      <button class="btn block" id="exportBtn" style="margin-top:6px;">☁️ Backup now</button>
      <div style="font-size:11.5px;color:var(--muted);margin-top:8px;">Last backup: ${lastBackupStr}</div>

      <div class="settings-row" style="margin-top:6px;">
        <div>
          <div class="lbl">Import backup</div>
          <div class="desc">Restore from a file previously backed up to Drive/Files.</div>
        </div>
        <button class="btn small ghost" id="importBtn">Import</button>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
      <div class="settings-row">
        <div>
          <div class="lbl">Reset all data</div>
          <div class="desc">Erases history, streaks, and badges. Can't be undone.</div>
        </div>
        <button class="btn small danger" id="resetBtn">Reset</button>
      </div>
    </div>

    <div class="card">
      <div class="lbl" style="font-weight:800;">About this plan</div>
      <p style="font-size:12.5px;color:var(--muted);line-height:1.5;margin:8px 0 0;">
        Calisthenics + 10 lb dumbbell plan, 6 training days a week with Sunday off. Sessions target
        about 45 minutes (max 1 hour) including warm-up. Days marked "alternates" split similar
        exercises across a Week A / Week B rotation so nothing gets repetitive. All data is stored
        only on this device.
      </p>
    </div>
  `;

  document.getElementById("weekSeg").querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{
      DATA.settings.weekOverride = b.getAttribute("data-val");
      saveData();
      renderSettings();
    };
  });
  document.getElementById("exportBtn").onclick = async ()=>{
    const blob = new Blob([JSON.stringify(DATA,null,2)], {type:"application/json"});
    const fileName = "workout-data-backup-"+dateKey(todayDate())+".json";
    const firstTime = !DATA.settings.lastBackupAt;
    // Prefer the native Share Sheet - lets him pick Google Drive (or Files -> Drive)
    // as the save destination directly, no separate upload step needed.
    let completed = false, cancelled = false;
    try{
      const file = new File([blob], fileName, {type:"application/json"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:"Workout data backup"});
        completed = true;
      }
    }catch(e){
      if(e && e.name === "AbortError") cancelled = true; // user backed out of the share sheet
    }
    if(!completed && !cancelled){
      // Share API unsupported on this browser - fall back to a plain download
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      completed = true;
    }
    if(cancelled) return;
    DATA.settings.lastBackupAt = Date.now();
    saveData();
    renderSettings();
    if(firstTime){
      showSimpleToast("Backup saved", "Next time the share sheet opens, choose Google Drive to keep it there automatically.");
    }
  };
  document.getElementById("importBtn").onclick = ()=> document.getElementById("importFile").click();
  document.getElementById("importFile").onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(parsed && parsed.logs){
          DATA = parsed;
          saveData();
          showSimpleToast("Imported!", "Your backup has been restored.");
          renderSettings();
        } else { alert("That file doesn't look like a valid backup."); }
      }catch(err){ alert("Couldn't read that file."); }
    };
    reader.readAsText(file);
  };
  document.getElementById("resetBtn").onclick = ()=>{
    if(confirm("Erase all workout history, streaks, and badges? This can't be undone.")){
      DATA = {logs:{}, settings:{weekOverride:"auto"}, earnedBadges:{}};
      saveData();
      showSimpleToast("Reset complete", "Starting fresh.");
      renderSettings();
    }
  };
}

/* ============================= TAB SWITCHING ============================= */
function renderTab(tab){
  activeTab = tab;
  document.querySelectorAll("nav.tabbar button").forEach(b=>{
    b.classList.toggle("active", b.getAttribute("data-tab")===tab);
  });
  if(tab==="today") renderToday();
  else if(tab==="history"){ historyMonthOffset=0; renderHistory(); }
  else if(tab==="awards") renderAwards();
  else if(tab==="settings") renderSettings();
}
document.querySelectorAll("nav.tabbar button").forEach(b=>{
  b.onclick = ()=> renderTab(b.getAttribute("data-tab"));
});

renderTab("today");
</script>

</html>
